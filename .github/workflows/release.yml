---
name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Create a missing release without requiring a version bump'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TEKSTTV_COMMIT: 3a29ad217caecea5ea6f34a8ba12e3ce308bd2f0
  STREEKOMROEP_COMMIT: 2628ba7ec275a4dba566e3bb15212f5ae476034c

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases must be dispatched from the main branch."
          exit 1

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check out TekstTV extension API
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: oszuidwest/teksttv-wp-plugin
          ref: ${{ env.TEKSTTV_COMMIT }}
          path: upstream/teksttv

      - name: Check out Streekomroep schedule API
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: oszuidwest/streekomroep-wp
          ref: ${{ env.STREEKOMROEP_COMMIT }}
          path: upstream/streekomroep

      - name: Extract and validate version
        id: version
        run: |
          VERSION=$(awk '
            /^[[:space:]]*\*?[[:space:]]*Version:[[:space:]]*/ {
              sub(/^[[:space:]]*\*?[[:space:]]*Version:[[:space:]]*/, "")
              sub(/[[:space:]]+$/, "")
              print
              exit
            }
          ' teksttv-wp-extensions.php)
          PRE='(-(alpha|beta|rc)\.[0-9]+)?'
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+${PRE}$ ]]; then
            echo "::error::Invalid plugin version: '$VERSION'."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          LATEST_TAG=$(git tag --list | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
          LATEST_BARE="${LATEST_TAG#v}"
          version_gt() {
            test "$(printf '%s\n' "$@" | sort -V | head -1)" != "$1"
          }

          TAG_EXISTS=false
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            TAG_EXISTS=true
            TAG_COMMIT=$(git rev-list -n 1 "$VERSION")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $VERSION exists on $TAG_COMMIT, not $GITHUB_SHA."
              exit 1
            fi
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::GitHub Release $VERSION already exists and will not be overwritten."
            exit 1
          fi

          if [ "$FORCE" = true ]; then
            RELEASE_NEEDED=true
            REASON="forced recovery of a missing release"
          elif [ -z "$LATEST_TAG" ]; then
            RELEASE_NEEDED=true
            REASON="first release"
          elif version_gt "$VERSION" "$LATEST_BARE"; then
            RELEASE_NEEDED=true
            REASON="version bumped from $LATEST_TAG to $VERSION"
          else
            RELEASE_NEEDED=false
            REASON="no version bump (latest: $LATEST_TAG, header: $VERSION)"
          fi

          echo "Release decision: $RELEASE_NEEDED ($REASON)"
          echo "release_needed=$RELEASE_NEEDED" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"

      - name: Report skipped release
        if: steps.decide.outputs.release_needed != 'true'
        run: echo "::notice::Skipping release because the plugin version was not bumped."

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: steps.decide.outputs.release_needed == 'true'
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2, wp-cli

      - name: Install development dependencies
        if: steps.decide.outputs.release_needed == 'true'
        run: composer install --no-progress --prefer-dist --no-interaction --optimize-autoloader

      - name: Run release quality gate
        if: steps.decide.outputs.release_needed == 'true'
        run: |
          composer validate --strict --no-check-publish
          composer security
          composer quality
          composer contract
        env:
          TEKSTTV_PATH: upstream/teksttv
          STREEKOMROEP_PATH: upstream/streekomroep

      - name: Verify translation template
        if: steps.decide.outputs.release_needed == 'true'
        run: |
          wp i18n make-pot . /tmp/teksttv-wp-extensions.pot \
            --slug=teksttv-wp-extensions \
            --domain=teksttv-wp-extensions \
            --include=src,teksttv-wp-extensions.php \
            --exclude=vendor,tests,stubs,dist,upstream \
            --skip-audit
          sed -E '/POT-Creation-Date:|X-Generator:/d' \
            languages/teksttv-wp-extensions.pot > /tmp/committed.pot
          sed -E '/POT-Creation-Date:|X-Generator:/d' \
            /tmp/teksttv-wp-extensions.pot > /tmp/generated.pot
          diff -u /tmp/committed.pot /tmp/generated.pot

      - name: Configure the Plugin Check environment
        if: steps.decide.outputs.release_needed == 'true'
        run: |
          cat > .wp-env.json <<'JSON'
          {
            "core": null,
            "port": 8880,
            "testsPort": 8881,
            "mappings": {
              "wp-content/plugins/teksttv-wp-extensions": ".",
              "wp-content/plugins/teksttv": "./upstream/teksttv"
            }
          }
          JSON

      - name: WordPress Plugin Check
        if: steps.decide.outputs.release_needed == 'true'
        uses: wordpress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2 # v1.3.0
        with:
          slug: teksttv-wp-extensions
          exclude-files: |
            scripts/check-coverage.php
            stubs/
            tests/
            upstream/
          exclude-checks: |
            file_type
            plugin_readme
            plugin_updater

      - name: Build allowlisted release package
        if: steps.decide.outputs.release_needed == 'true'
        run: scripts/build-plugin.sh

      - name: Verify release package
        if: steps.decide.outputs.release_needed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="dist/teksttv-wp-extensions-${VERSION}.zip"
          test -s "$ZIP"
          test -s "${ZIP}.sha256"
          zipinfo -1 "$ZIP" > /tmp/package-files.txt
          grep -qx 'teksttv-wp-extensions/teksttv-wp-extensions.php' /tmp/package-files.txt
          grep -qx 'teksttv-wp-extensions/README.md' /tmp/package-files.txt
          grep -q '^teksttv-wp-extensions/src/' /tmp/package-files.txt
          grep -q '^teksttv-wp-extensions/languages/' /tmp/package-files.txt
          if grep -Eq '/(tests|stubs|vendor|upstream|\.github|scripts)/|/(composer|phpcs|phpstan|phpunit)' /tmp/package-files.txt; then
            echo "::error::Development files found in the release package."
            cat /tmp/package-files.txt
            exit 1
          fi

      - name: Tag the validated commit
        if: steps.decide.outputs.release_needed == 'true' && steps.decide.outputs.tag_exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Create GitHub release
        if: steps.decide.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="dist/teksttv-wp-extensions-${VERSION}.zip"
          ARGS=("$VERSION" "$ZIP" "${ZIP}.sha256" --title "$VERSION" --generate-notes --verify-tag)
          if [[ "$VERSION" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"
