---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEKSTTV_COMMIT: 3a29ad217caecea5ea6f34a8ba12e3ce308bd2f0
  STREEKOMROEP_COMMIT: 2628ba7ec275a4dba566e3bb15212f5ae476034c

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate PHP syntax
        run: >-
          find . -path './vendor' -prune -o -path './upstream' -prune -o
          -name '*.php' -type f -print0 | xargs -0 -n1 php --syntax-check

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction --optimize-autoloader

      - name: Audit Composer dependencies
        run: composer security

      - name: PHP_CodeSniffer
        run: composer check

      - name: PHPStan
        run: composer analyse

      - name: PHPUnit
        run: composer test -- --no-coverage

      - name: Check out the TekstTV dependency
        if: matrix.php == '8.4'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: oszuidwest/teksttv-wp-plugin
          ref: ${{ env.TEKSTTV_COMMIT }}
          path: upstream/teksttv

      - name: Configure the Plugin Check environment
        if: matrix.php == '8.4'
        run: |
          cat > .wp-env.json <<'JSON'
          {
            "core": null,
            "port": 8880,
            "testsPort": 8881,
            "mappings": {
              "wp-content/plugins/teksttv-wp-extensions": ".",
              "wp-content/plugins/teksttv": "./upstream/teksttv"
            }
          }
          JSON

      - name: Set up Node for Plugin Check
        if: matrix.php == '8.4'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: '24'

      - name: Install Plugin Check tooling
        if: matrix.php == '8.4'
        run: npm install --global @wordpress/env@11.10.0

      - name: WordPress Plugin Check
        if: matrix.php == '8.4'
        run: |
          wp-env start --update
          wp-env run cli wp plugin install plugin-check --version=2.0.0 --activate
          wp-env run cli wp plugin activate teksttv
          wp-env run cli wp plugin activate teksttv-wp-extensions
          wp-env run cli wp plugin check \
            --slug=teksttv-wp-extensions \
            --exclude-files=scripts/check-coverage.php,stubs/,tests/,upstream/ \
            --exclude-checks=file_type,plugin_readme,plugin_updater

      - name: Stop the Plugin Check environment
        if: ${{ always() && matrix.php == '8.4' }}
        run: wp-env stop

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: xdebug
          tools: composer:v2

      - run: composer install --no-progress --prefer-dist --no-interaction
      - run: composer test -- --coverage-clover=coverage.xml
      - run: php scripts/check-coverage.php coverage.xml 90

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: php-coverage
          path: coverage.xml
          retention-days: 14
          if-no-files-found: error

  translations:
    name: Translations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli

      - name: Verify POT is current
        run: |
          wp i18n make-pot . /tmp/teksttv-wp-extensions.pot \
            --slug=teksttv-wp-extensions \
            --domain=teksttv-wp-extensions \
            --include=src,teksttv-wp-extensions.php \
            --exclude=vendor,tests,stubs,dist \
            --skip-audit
          sed -E '/POT-Creation-Date:|X-Generator:/d' \
            languages/teksttv-wp-extensions.pot > /tmp/committed.pot
          sed -E '/POT-Creation-Date:|X-Generator:/d' \
            /tmp/teksttv-wp-extensions.pot > /tmp/generated.pot
          diff -u /tmp/committed.pot /tmp/generated.pot

  contract:
    name: Upstream contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check out TekstTV extension API
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: oszuidwest/teksttv-wp-plugin
          ref: ${{ env.TEKSTTV_COMMIT }}
          path: upstream/teksttv

      - name: Check out Streekomroep schedule API
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: oszuidwest/streekomroep-wp
          ref: ${{ env.STREEKOMROEP_COMMIT }}
          path: upstream/streekomroep

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - run: composer install --no-progress --prefer-dist --no-interaction
      - run: composer contract
        env:
          TEKSTTV_PATH: upstream/teksttv
          STREEKOMROEP_PATH: upstream/streekomroep
